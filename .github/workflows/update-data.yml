# 最简单、最可靠的工作流
name: Update Market Data

on:
  schedule:
    # 每1小时执行一次
    # 北京时间(UTC+8)：1点,2点,3点,4点,5点,6点,7点,8点,9点,10点,11点,12点,13点,14点,15点,16点,17点,18点,19点,20点,21点,22点,23点,0点
    # 覆盖美股收盘（凌晨4-5点）后数据更新 + A股净值（上午10点-下午5点）刷新
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: pip install -r requirements.txt
      
      - name: 运行脚本
        run: python scripts/fetch_data.py
      
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-data.json
          git commit -m "自动更新数据" || true
          git push
